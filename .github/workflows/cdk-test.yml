name: cdk-test

on:
  push:
    branches: [main]
    paths:
      - 'AWS/cdk/**'
      - '.github/workflows/cdk-test.yml'
  pull_request:
    paths:
      - 'AWS/cdk/**'
      - '.github/workflows/cdk-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: AWS/cdk

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AWS/cdk/package-lock.json

      - run: npm ci --no-audit --no-fund

      # LambdaStack uses `lambda.Code.fromAsset("../lambda-code/dist/lambda.zip")`
      # — synth fails if that path doesn't exist. Tests don't care about
      # the contents (cdk just hashes the file), so a stub is fine.
      - name: Stub lambda asset for synth
        run: |
          mkdir -p ../lambda-code/dist
          : > ../lambda-code/dist/empty
          (cd ../lambda-code/dist && zip lambda.zip empty)

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage (>=95% threshold enforced by vitest)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdk-coverage
          path: AWS/cdk/coverage
          retention-days: 14
