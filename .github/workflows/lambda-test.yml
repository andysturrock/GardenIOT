name: lambda-test

on:
  push:
    branches: [main]
    paths:
      - 'AWS/lambda-code/**'
      - '.github/workflows/lambda-test.yml'
  pull_request:
    paths:
      - 'AWS/lambda-code/**'
      - '.github/workflows/lambda-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: AWS/lambda-code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AWS/lambda-code/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage (>=95% threshold enforced by vitest)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-coverage
          path: AWS/lambda-code/coverage
          retention-days: 14
